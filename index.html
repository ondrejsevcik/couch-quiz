<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Couch Quiz">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1a6b'/%3E%3Ctext x='32' y='45' font-family='Arial' font-weight='bold' font-size='36' fill='%23ffcc4d' text-anchor='middle'%3E%3F%3C/text%3E%3C/svg%3E">
<title>Couch Quiz</title>
<style>
  :root {
    --bg: #060b2e;
    --tile: #0b1a6b;
    --tile-hi: #14299b;
    --gold: #ffcc4d;
    --ink: #ffffff;
    --dead: #04081c;
    --bad: #ff6b6b;
    --bad-btn: #c62828;
    --pad: clamp(6px, 1.4vw, 14px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(var(--pad), env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right))
             max(var(--pad), env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-left));
    gap: var(--pad);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation; /* no double-tap zoom mid-game; pinch still works */
  }
  button, input { font-family: inherit; }
  input { user-select: text; -webkit-user-select: text; }
  button:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .btn:focus-visible { outline-color: #000; outline-offset: -5px; }
  button { cursor: pointer; border: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .hidden { display: none !important; }

  /* ---------- header ---------- */
  header {
    width: 100%;
    max-width: 1400px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
  }
  h1 {
    font-size: clamp(18px, 3vw, 34px);
    letter-spacing: 3px;
    color: var(--gold);
    text-shadow: 3px 3px 0 #000;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #controls { display: flex; gap: 8px; }
  .small { background: #223; color: #fff; padding: 8px 14px; min-height: 36px; border-radius: 6px; font-size: 13px; }
  .small:disabled, .pl button:disabled { opacity: .4; cursor: default; }

  /* ---------- scores ---------- */
  #scores {
    display: flex;
    gap: clamp(6px, 1vw, 12px);
    flex-wrap: wrap;
    justify-content: center;
    flex-shrink: 0;
    width: 100%;
    max-width: 1400px;
  }
  .player {
    background: var(--tile);
    border: 3px solid #000;
    border-radius: 8px;
    padding: 4px 16px;
    text-align: center;
    min-width: 110px;
    max-width: 240px;
    overflow: hidden;
  }
  .player .nm {
    font-size: 13px; letter-spacing: 2px; opacity: .85; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .player .sc { font-size: 22px; font-weight: bold; color: var(--gold); }
  .player .sc.neg { color: var(--bad); }

  /* ---------- board ---------- */
  #board {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-rows: auto repeat(6, minmax(0, 1fr));
    gap: clamp(3px, .5vw, 6px);
    width: 100%;
    max-width: 1400px;
    flex: 1;
    min-height: 0;
  }
  .cat {
    background: var(--tile);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px 4px;
    font-weight: bold;
    text-transform: uppercase;
    font-size: clamp(9px, 1.2vw, 17px);
    letter-spacing: 1px;
    line-height: 1.15;
    border-bottom: 4px solid #000;
  }
  .clue-btn {
    background: var(--tile);
    color: var(--gold);
    font-size: clamp(14px, min(3vw, 5vh), 42px);
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
    min-height: 0;
    transition: background .12s;
  }
  @media (hover: hover) { .clue-btn:hover:not(:disabled) { background: var(--tile-hi); } }
  .clue-btn:active:not(:disabled) { background: var(--tile-hi); }
  .clue-btn:disabled { background: var(--dead); color: transparent; cursor: default; }

  /* phones in portrait: tight columns */
  @media (max-width: 600px) {
    .cat { letter-spacing: 0; padding: 6px 2px; border-bottom-width: 3px; font-size: clamp(9px, 2.4vw, 13px); }
    .player { min-width: 0; max-width: none; padding: 3px 10px; flex: 1 1 28%; }
    .player .nm { font-size: 11px; letter-spacing: 1px; }
    .player .sc { font-size: 18px; }
  }
  /* phones in landscape: every pixel of height counts */
  @media (max-height: 500px) {
    header { display: contents; }
    h1 { display: none; }
    #controls { order: 3; }
    body { gap: 6px; }
    #scores { flex-wrap: nowrap; }
    .player { padding: 2px 10px; display: flex; gap: 8px; align-items: baseline; min-width: 0; flex: 1 1 0; justify-content: center; }
    .player .sc { flex-shrink: 0; }
    .clue-btn { font-size: clamp(11px, 4.5vh, 24px); }
    .player .sc { font-size: 16px; }
    .cat { padding: 4px 2px; }
    .small { min-height: 30px; padding: 4px 12px; }
  }

  /* ---------- full-screen panels (clue + setup) ---------- */
  .panel {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: max(5vw, env(safe-area-inset-top)) max(5vw, env(safe-area-inset-right))
             max(5vw, env(safe-area-inset-bottom)) max(5vw, env(safe-area-inset-left));
  }
  .panel.show { display: flex; }

  #modal { background: var(--tile); text-align: center; gap: clamp(14px, 3vh, 28px); z-index: 10; }
  /* safe centring: long clues scroll instead of clipping off the top */
  #modal > :first-child { margin-top: auto; }
  #modal > :last-child { margin-bottom: auto; }
  #mCat { font-size: clamp(13px, 2vw, 24px); color: var(--gold); letter-spacing: 3px; text-transform: uppercase; }
  #mText {
    font-size: clamp(20px, min(4.2vw, 6vh), 60px);
    font-weight: bold;
    text-transform: uppercase;
    line-height: 1.25;
    max-width: 22ch;
    text-shadow: 3px 3px 0 #000;
    user-select: text;
    -webkit-user-select: text;
  }
  /* Estonian translation under the English clue, for players with less English */
  #mQ { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 20px); }
  #mTextEt {
    font-size: clamp(16px, min(2.8vw, 4vh), 36px);
    line-height: 1.3;
    max-width: 30ch;
    color: #c9d3ff;
    padding-top: clamp(10px, 2vh, 20px);
    border-top: 2px solid rgba(255, 255, 255, .25);
    user-select: text;
    -webkit-user-select: text;
  }
  /* two languages need more room: smaller, wider English text */
  #mQ.bi #mText { font-size: clamp(18px, min(3vw, 3.6vh), 40px); max-width: 34ch; }
  #mQ.bi #mTextEt { font-size: clamp(15px, min(2.2vw, 2.8vh), 28px); max-width: 44ch; }
  #mAnswer { font-size: clamp(20px, min(3.4vw, 5vh), 46px); color: var(--gold); font-weight: bold; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    background: var(--gold);
    color: #000;
    font-size: clamp(15px, 1.6vw, 22px);
    font-weight: bold;
    padding: 12px 24px;
    min-height: 48px;
    border-radius: 8px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn.ghost { background: #fff; }
  .btn.bad { background: var(--bad-btn); color: #fff; }
  /* who-is-answering buttons: equal widths, long names truncate */
  #mStage { width: 100%; }
  .row.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); max-width: 960px; margin-inline: auto; }
  .row.players .btn { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline: 12px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .hint { font-size: 15px; opacity: .75; letter-spacing: 1px; }

  /* ---------- setup ---------- */
  #setup { background: var(--bg); z-index: 20; gap: 22px; padding-bottom: 0; }
  #setup h1 { font-size: clamp(28px, 6vw, 56px); margin-top: 8px; }
  #setup section { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 10px; }
  #setup h2 { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  #playerList { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .pl { display: flex; gap: 6px; }
  .pl input {
    flex: 1;
    min-width: 0;
    font-size: 17px; /* >=16px stops iOS zooming on focus */
    padding: 10px 12px;
    border-radius: 8px;
    border: 2px solid #000;
    background: var(--tile);
    color: #fff;
  }
  .pl input:focus { outline: 2px solid var(--gold); }
  .pl button { background: #223; color: #fff; width: 44px; border-radius: 8px; font-size: 20px; }
  #catGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .chip {
    background: var(--tile);
    color: #fff;
    border: 3px solid #000;
    border-radius: 8px;
    padding: 12px 8px;
    min-height: 56px;
    font-size: 15px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    position: relative;
  }
  .chip.on { border-color: var(--gold); background: var(--tile-hi); color: var(--gold); }
  .chip .tag { display: block; font-size: 11px; font-weight: normal; opacity: .8; letter-spacing: 1px; margin-top: 3px; }
  .setup-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #startBar { position: sticky; bottom: 0; padding: 12px 0 max(12px, env(safe-area-inset-bottom)); background: var(--bg); width: 100%; max-width: 900px; justify-content: center; }

  /* small phones: long clue + 6 players must still fit without scrolling */
  @media (max-height: 700px) {
    #mText { font-size: clamp(17px, min(4.2vw, 4.5vh), 60px); }
    #modal .btn { min-height: 42px; padding: 8px 16px; }
  }
  /* clue screen on short (landscape phone) viewports: keep the buttons in view */
  @media (max-height: 500px) {
    #modal { gap: 10px; padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    #mText { max-width: 44ch; font-size: 17px; text-shadow: 2px 2px 0 #000; }
    #mAnswer { font-size: 18px; }
    /* both languages side by side, so neither pushes the buttons off screen */
    #mQ.bi { flex-direction: row; align-items: flex-start; text-align: left; gap: 14px; }
    #mQ.bi > * { flex: 1; max-width: none; }
    #mQ.bi #mText { font-size: 15px; }
    #mQ.bi #mTextEt { font-size: 14px; max-width: none; border-top: none; padding-top: 0; border-left: 2px solid rgba(255, 255, 255, .25); padding-left: 14px; }
    .btn { min-height: 40px; padding: 8px 18px; }
    .row { margin-top: 8px !important; }
  }
</style>
</head>
<body>

<header id="header">
  <h1>Couch Quiz</h1>
  <div id="controls">
    <button class="small" id="toSetup">New board</button>
    <button class="small" id="resetScores">Reset scores</button>
  </div>
</header>
<div id="scores"></div>
<div id="board"></div>

<div id="modal" class="panel" role="dialog" aria-modal="true" aria-labelledby="mText">
  <div id="mCat"></div>
  <div id="mQ">
    <div id="mText"></div>
    <div id="mTextEt" lang="et"></div>
  </div>
  <div id="mMedia"></div>
  <div id="mAnswer"></div>
  <div id="mStage"></div>
</div>

<div id="setup" class="panel">
  <h1>Couch Quiz</h1>
  <section>
    <h2>Players</h2>
    <div id="playerList"></div>
    <div class="setup-bar"><button class="small" id="addPlayer">+ Add player</button></div>
  </section>
  <section>
    <h2 id="catHead" aria-live="polite">Pick 6 categories</h2>
    <div class="setup-bar">
      <button class="small" id="randomCats">Random 6</button>
      <button class="small" id="clearCats">Clear</button>
    </div>
    <div id="catGrid"></div>
  </section>
  <div id="startBar" class="setup-bar">
    <button class="btn ghost" id="backToGame">Back to game</button>
    <button class="btn" id="startGame">Start</button>
  </div>
</div>

<script>
/* =====================================================================
   QUESTIONS — edit freely. Each category needs exactly 6 clues,
   ordered easiest to hardest (they map to 100 through 600).
   Write each clue as a plain-English question ("Which...?", "Who...?").
   Fact-check new clues, and make sure each has exactly one right answer.
   ===================================================================== */
const CATEGORIES = [
  {
    name: "General Knowledge",
    clues: [
      ["Lakes freeze from the top down because the solid form of this substance floats on its liquid form. What is the substance?", "Water"],
      ["Which is the only letter of the alphabet that does not appear in the name of any US state?", "Q"],
      ["In 1582, ten days were removed from October when a new calendar was introduced. Britain only switched in 1752 and had to skip eleven days. What is this calendar called?", "The Gregorian calendar"],
      ["Which Indonesian volcano erupted in 1815 and caused the 'year without a summer', the cold summer in which Mary Shelley began writing Frankenstein?", "Mount Tambora"],
      ["Since 2019, the kilogram is no longer defined by a metal cylinder kept near Paris. Which physical constant is it defined by now?", "The Planck constant"],
      ["Which Prussian explorer and naturalist, born in 1769, has more places, plants and animals named after him than anyone else?", "Alexander von Humboldt"]
    ],
    et: [
      "Järved külmuvad pealt alla, sest selle aine tahke vorm hõljub oma vedela vormi peal. Mis aine see on?",
      "Milline on ainus tähestiku täht, mida ei leidu ühegi USA osariigi nimes?",
      "1582. aastal võeti uue kalendri kasutuselevõtul oktoobrist välja kümme päeva. Suurbritannia läks üle alles 1752. aastal ja pidi vahele jätma üksteist päeva. Mis selle kalendri nimi on?",
      "Milline Indoneesia vulkaan purskas 1815. aastal ja põhjustas „suveta aasta“, külma suve, mil Mary Shelley hakkas kirjutama „Frankensteini“?",
      "Alates 2019. aastast ei määratleta kilogrammi enam Pariisi lähedal hoitava metallsilindri abil. Millise füüsikalise konstandi abil see nüüd määratletakse?",
      "Kelle nime kannab rohkem paiku, taimi ja loomi kui kellegi teise nime? Ta on 1769. aastal sündinud preisi maadeuurija ja loodusteadlane."
    ]
  },
  {
    name: "Movies",
    clues: [
      ["In which film did the mechanical shark break down so often that the director had to hide it for most of the movie?", "Jaws"],
      ["Which film director appeared briefly in most of his own films, and later put these cameos near the start so audiences would stop looking for him?", "Alfred Hitchcock"],
      ["Which 1927 German silent film, famous for its female robot, was so expensive that it almost bankrupted its studio?", "Metropolis"],
      ["Which 1941 film lost Best Picture to 'How Green Was My Valley' and was attacked by the newspaper owner it made fun of?", "Citizen Kane"],
      ["Which 2020 Christopher Nolan film is named after a word in the Sator Square, an old Latin word puzzle found scratched into a wall at Pompeii?", "Tenet"],
      ["Which 1927 silent film about American fighter pilots in the First World War won the top prize at the very first Academy Awards?", "Wings"]
    ],
    et: [
      "Millises filmis läks mehaaniline hai nii tihti katki, et režissöör pidi seda enamiku filmi vältel peitma?",
      "Milline filmirežissöör ilmus korraks enamikus oma filmides ja tõstis hiljem need kaadrid filmi algusesse, et vaatajad teda enam ei otsiks?",
      "Milline 1927. aasta saksa tummfilm, mis on kuulus oma naisroboti poolest, oli nii kallis, et viis oma stuudio peaaegu pankrotti?",
      "Milline 1941. aasta film kaotas parima filmi auhinna filmile „How Green Was My Valley“ ning seda ründas ajalehe omanik, keda film pilkas?",
      "Milline 2020. aasta Christopher Nolani film on nime saanud ühe sõna järgi Sator-ruudus, vanas ladinakeelses sõnamõistatuses, mis leiti Pompeiis seinale kraabituna?",
      "Milline 1927. aasta tummfilm Ameerika hävituslendurite kohta Esimeses maailmasõjas võitis esimesel Oscarite jagamisel peaauhinna?"
    ]
  },
  {
    name: "Food",
    clues: [
      ["What is the chemical reaction between sugars and amino acids that browns a steak and gives bread its crust? It is named after a French scientist.", "The Maillard reaction"],
      ["Which spice is the most expensive in the world by weight, needing about 150,000 flowers to make one kilogram?", "Saffron"],
      ["Which cured pork belongs in a real carbonara? Its name comes from the Italian word for 'cheek'.", "Guanciale"],
      ["In 1908 a Japanese scientist discovered umami, the fifth basic taste, by studying a broth made from which seaweed?", "Kombu"],
      ["Which spice from south-west China makes your lips buzz and go numb? It is actually the dried husk of a berry from the citrus family.", "Sichuan pepper"],
      ["Which 19th-century French chef organised professional kitchens into the 'brigade' system and defined the five mother sauces?", "Auguste Escoffier"]
    ],
    et: [
      "Mis nime kannab keemiline reaktsioon suhkrute ja aminohapete vahel, mis pruunistab steiki ja annab leivale koore? See on nimetatud ühe prantsuse teadlase järgi.",
      "Milline vürts on maailmas kaalu järgi kõige kallim? Ühe kilogrammi tegemiseks on vaja umbes 150 000 õit.",
      "Milline soolatud sealiha kuulub päris carbonara sisse? Selle nimi tuleb itaalia sõnast, mis tähendab „põske“.",
      "1908. aastal avastas üks Jaapani teadlane umami, viienda põhimaitse, uurides puljongit, mis oli tehtud millisest merevetikast?",
      "Milline Edela-Hiinast pärit vürts paneb huuled kihelema ja tuimaks minema? See on tegelikult tsitrusviljade sugulastaime marja kuivatatud kest.",
      "Milline 19. sajandi prantsuse kokk korraldas professionaalsed köögid „brigaadisüsteemi“ järgi ja määratles viis põhikastet?"
    ]
  },
  {
    name: "Social Media",
    clues: [
      ["Which short-video app, owned by ByteDance, merged with the lip-syncing app Musical.ly in 2018?", "TikTok"],
      ["In 2007, a user named Chris Messina suggested which feature as a way to group conversations on social media? He did not work for the company.", "The hashtag"],
      ["Which service started as a podcast company called Odeo, and changed direction after iTunes added podcasts?", "Twitter"],
      ["Which video site was first planned as a dating site called 'Tune In Hook Up'?", "YouTube"],
      ["What was Snapchat called when it first launched, before it was renamed in 2011?", "Picaboo"],
      ["Each autumn, new students joined Usenet without knowing its rules. In 1993 AOL let all its users in, and the wave never stopped. What did Usenet users call this?", "Eternal September"]
    ],
    et: [
      "Milline ByteDance'ile kuuluv lühivideorakendus ühines 2018. aastal huulte sünkroonimise rakendusega Musical.ly?",
      "2007. aastal pakkus kasutaja nimega Chris Messina sotsiaalmeedias vestluste rühmitamiseks välja millise funktsiooni? Ta ei töötanud selle ettevõtte heaks.",
      "Milline teenus alustas podcastide ettevõttena nimega Odeo ja muutis suunda pärast seda, kui iTunes lisas podcastid?",
      "Milline videoveebileht oli esialgu kavandatud tutvumisportaaliks nimega „Tune In Hook Up“?",
      "Mis nime kandis Snapchat alguses, enne kui see 2011. aastal ümber nimetati?",
      "Igal sügisel liitusid uued tudengid Usenetiga, teadmata selle reegleid. 1993. aastal lasi AOL sinna kõik oma kasutajad ja see laine ei lõppenud kunagi. Mis nime andsid Usenetti kasutajad sellele nähtusele?"
    ]
  },
  {
    name: "Internet",
    clues: [
      ["What was the US military research network from 1969 that grew into the internet? It first connected four sites in California and Utah.", "ARPANET"],
      ["In 1971, which keyboard symbol did Ray Tomlinson choose for email addresses, because it was not part of anyone's name?", "The at sign"],
      ["On 1 January 1983, the early internet switched over to which set of protocols? This is why that date is sometimes called the internet's birthday.", "TCP/IP"],
      ["In 1993, CERN made which invention by Tim Berners-Lee free for anyone to use, without royalties?", "The World Wide Web"],
      ["What was the 1988 self-copying program that led to the first jury conviction under the US Computer Fraud and Abuse Act?", "The Morris Worm"],
      ["Which method, published in 1976, lets two strangers agree on a secret key even when anyone can read their messages?", "Diffie-Hellman key exchange"]
    ],
    et: [
      "Mis oli 1969. aasta USA sõjaväe uurimisvõrk, millest kasvas välja internet? See ühendas esialgu neli kohta Californias ja Utahs.",
      "1971. aastal valis Ray Tomlinson e-posti aadressides kasutamiseks millise klaviatuurimärgi, sest see ei esinenud kellegi nimes?",
      "1. jaanuaril 1983 läks varane internet üle millisele protokollide komplektile? Seetõttu nimetatakse seda kuupäeva vahel interneti sünnipäevaks.",
      "1993. aastal tegi CERN millise Tim Berners-Lee'i leiutise kõigile tasuta kasutatavaks, ilma autoritasudeta?",
      "Mis oli 1988. aasta iseennast kopeeriv programm, mille tõttu mõisteti vandekohtu otsusega esimest korda süüdi USA arvutipettuse ja -kuritarvitamise seaduse alusel?",
      "Milline 1976. aastal avaldatud meetod võimaldab kahel võõral kokku leppida salajase võtme osas ka siis, kui igaüks saab nende sõnumeid lugeda?"
    ]
  },
  {
    name: "History",
    clues: [
      ["Which explorer was killed in a battle in the Philippines in 1521, leaving Juan Sebastián Elcano to finish the first voyage around the world?", "Ferdinand Magellan"],
      ["Mansa Musa ruled which West African empire? On his trip to Mecca in 1324, he gave away so much gold that its value fell in Cairo.", "Mali"],
      ["What was Hannibal's great win against Rome in 216 BC, still studied today as the classic example of surrounding an enemy army from both sides?", "Battle of Cannae"],

const VALUES = [100, 200, 300, 400, 500, 600];
const BOARD_SIZE = 6;
const MIN_PLAYERS = 2;
const MAX_PLAYERS = 6;
const DEFAULT_PLAYERS = ["", "", ""];   // blank: placeholders show "Player N"
const STORE_KEY = "couchquiz.v1";

/* =====================================================================
   STORAGE — names, played categories and the game in progress survive
   reloads (mobile browsers discard background tabs). Failures are
   ignored: the game still works without storage.
   ===================================================================== */
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
}
function saveStore() {
  const data = {
    players,
    played: [...played],
    game: state && {
      board: state.board.map(c => c.name),
      used: state.used,
      scores: state.scores,
      open: state.open,
      answering: state.answering,
      phase: state.phase
    }
  };
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
}

/* =====================================================================
   STATE
   ===================================================================== */
const saved = loadStore();
let players = Array.isArray(saved.players) && saved.players.length >= MIN_PLAYERS
  ? saved.players.slice(0, MAX_PLAYERS).map(p => typeof p === "string" ? p : "")
  : DEFAULT_PLAYERS.slice();
// Category names used in past games; names no longer in the pool are dropped.
let played = new Set(Array.isArray(saved.played)
  ? saved.played.filter(n => CATEGORIES.some(c => c.name === n)) : []);
let state = null;                           // the game in progress
let picked = [];                            // category names chosen on setup
let view = "setup";                         // setup | game
let returnFocus = null;                     // board tile index to refocus after a clue

const byName = name => CATEGORIES.find(c => c.name === name);
// Soft hyphens for long words, so narrow phone columns break them cleanly
// instead of mid-letter. Tests require an entry for every word of 9+ letters.
// Applied only on narrow screens: WebKit breaks at soft hyphens even with
// `hyphens: none`, which splits words that would fit on wider screens.
const SOFT_HYPHENS = {
  Knowledge: "Know\u00ADledge", Mythology: "Mytho\u00ADlogy", Literature: "Litera\u00ADture",
  Architecture: "Archi\u00ADtecture", Geography: "Geo\u00ADgraphy", Television: "Tele\u00ADvision",
  Inventions: "Inven\u00ADtions", Programming: "Program\u00ADming"
};
const narrow = typeof matchMedia === "function" ? matchMedia("(max-width: 600px)") : { matches: false };
const catLabel = name => narrow.matches ? name.replace(/[A-Za-z]+/g, w => SOFT_HYPHENS[w] || w) : name;
const playerName = i => (players[i] || "").trim() || "Player " + (i + 1);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function restoreGame(g) {
  if (!g || !Array.isArray(g.board) || !Array.isArray(g.scores)) return null;
  const board = g.board.map(byName);
  if (board.length !== BOARD_SIZE || board.some(c => !c)) return null;
  if (g.scores.length !== players.length || !g.scores.every(Number.isFinite)) return null;
  const used = g.used && typeof g.used === "object" ? g.used : {};
  const game = { board, used, scores: g.scores, open: null, answering: null, phase: "board" };
  // Reopen a clue that was on screen, so a reload can't replay a seen answer.
  const o = g.open;
  if (o && board[o.cat] && board[o.cat].clues[o.idx] && VALUES[o.idx] === o.value) {
    game.open = { cat: o.cat, idx: o.idx, value: o.value };
    const judging = g.phase === "judge" && players[g.answering] !== undefined;
    game.phase = judging ? "judge" : g.phase === "answer" ? "answer" : "clue";
    if (judging) game.answering = g.answering;
  }
  return game;
}

// Fresh categories first, then ones already played, each group shuffled.
function randomPick() {
  const names = CATEGORIES.map(c => c.name);
  const fresh = names.filter(n => !played.has(n));
  const stale = names.filter(n => played.has(n));
  return shuffle(fresh).concat(shuffle(stale)).slice(0, BOARD_SIZE);
}

function startGame(names) {
  state = {
    board: shuffle(names.map(byName)),
    used: {},                        // "col-row" -> true
    // Scores carry over; add/remove on setup keeps them aligned per player.
    scores: state ? state.scores : new Array(players.length).fill(0),
    open: null,                      // { cat, idx, value }
    answering: null,                 // player index while judging
    phase: "board"                   // board | clue | judge | answer
  };
  names.forEach(n => played.add(n));
  // Once everything has been played, start the "fresh" cycle again.
  if (CATEGORIES.every(c => played.has(c.name))) played = new Set(names);
  view = "game";
  render();
}

/* =====================================================================
   RENDER
   ===================================================================== */
const $ = id => document.getElementById(id);
const boardEl = $("board");
const scoresEl = $("scores");
const modal = $("modal");
const setupEl = $("setup");

function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

function render() {
  saveStore();
  setupEl.classList.toggle("show", view === "setup");
  // Keep keyboard and screen-reader focus inside whichever panel is on top.
  const covered = view === "setup" || !!(state && state.open);
  [$("header"), scoresEl, boardEl].forEach(e => { e.inert = covered; });
  if (view === "setup") return renderSetup();
  renderScores();
  renderBoard();
  renderModal();
  if (returnFocus !== null && !state.open) {
    // Focus the closed tile's next open neighbour, so keyboard play continues.
    const tiles = [...boardEl.children].slice(BOARD_SIZE);
    const next = tiles.slice(returnFocus).concat(tiles).find(t => !t.disabled);
    if (next && next.focus) next.focus();
    returnFocus = null;
  }
}

function renderScores() {
  scoresEl.innerHTML = "";
  state.scores.forEach((score, i) => {
    const d = el("div", "player");
    d.appendChild(el("div", "nm", playerName(i)));
    d.appendChild(el("div", "sc" + (score < 0 ? " neg" : ""), String(score)));
    scoresEl.appendChild(d);
  });
}

function renderBoard() {
  boardEl.innerHTML = "";
  state.board.forEach(cat => boardEl.appendChild(el("div", "cat", catLabel(cat.name))));
  VALUES.forEach((value, row) => {
    state.board.forEach((cat, col) => {
      const b = el("button", "clue-btn");
      const used = state.used[col + "-" + row];
      b.setAttribute("aria-label", cat.name + " " + value + (used ? " used" : ""));
      if (used) {
        b.disabled = true;
      } else {
        b.textContent = value;
        b.addEventListener("click", () => openClue(col, row, value));
      }
      boardEl.appendChild(b);
    });
  });
}

function renderModal() {
  const stage = $("mStage");
  stage.innerHTML = "";
  if (!state.open) {
    modal.classList.remove("show");
    return;
  }
  modal.classList.add("show");
  const { cat, idx, value } = state.open;
  const category = state.board[cat];
  const [question, answer, mediaUrl] = category.clues[idx];

  $("mCat").textContent = category.name + " — " + value;
  $("mText").textContent = question;
  const et = category.et && category.et[idx];
  $("mTextEt").textContent = et || "";
  $("mTextEt").classList.toggle("hidden", !et);
  $("mQ").classList.toggle("bi", !!et);

  // Optional third element: a link to play the clip somewhere else.
  const mediaEl = $("mMedia");
  mediaEl.innerHTML = "";
  if (mediaUrl) {
    const play = el("a", "btn ghost", "▶ Play the clip");
    play.href = mediaUrl;
    play.target = "_blank";
    play.rel = "noopener noreferrer";
    mediaEl.appendChild(play);
  }

  const ansEl = $("mAnswer");
  ansEl.textContent = "Answer: " + answer;
  ansEl.classList.toggle("hidden", state.phase === "clue");

  const addRow = (buttons, label, cls) => {
    if (label) stage.appendChild(el("div", "hint", label));
    const row = el("div", "row" + (cls ? " " + cls : ""));
    row.style.marginTop = "14px";
    buttons.forEach(b => row.appendChild(b));
    stage.appendChild(row);
  };
  const button = (cls, text, fn) => {
    const b = el("button", cls, text);
    b.addEventListener("click", fn);
    return b;
  };

  if (state.phase === "clue") {
    addRow(state.scores.map((_, i) => button("btn", playerName(i), () => pickPlayer(i))), "Who is answering?", "players");
    addRow([button("btn ghost", "Nobody knows — reveal", reveal)]);
  }

  if (state.phase === "judge") {
    // Everyone shares one screen, so the answer is already public.
    // No steals: score it and move straight on.
    addRow([
      button("btn", "Correct  +" + value, () => judge(true)),
      button("btn bad", "Wrong  −" + value, () => judge(false))
    ], playerName(state.answering) + " answering — was it right?");
  }

  if (state.phase === "answer") {
    addRow([button("btn", "Back to board", closeClue)]);
  }
  modal.scrollTop = 0;
  // Move keyboard focus to the first action of each step.
  const first = stage.getElementsByTagName ? stage.getElementsByTagName("button")[0] : null;
  if (first) first.focus();
}

function renderSetup() {
  const list = $("playerList");
  list.innerHTML = "";
  players.forEach((name, i) => {
    const row = el("div", "pl");
    const input = el("input");
    input.value = name;
    input.placeholder = "Player " + (i + 1);
    input.maxLength = 16;
    input.setAttribute("aria-label", "Player " + (i + 1) + " name");
    // Update in place: re-rendering on every keystroke would drop focus.
    input.addEventListener("input", () => { players[i] = input.value; saveStore(); });
    row.appendChild(input);
    const rm = el("button", "", "×");
    rm.title = "Remove player";
    rm.setAttribute("aria-label", "Remove " + playerName(i));
    rm.disabled = players.length <= MIN_PLAYERS;
    rm.addEventListener("click", () => removePlayer(i));
    row.appendChild(rm);
    list.appendChild(row);
  });
  $("addPlayer").disabled = players.length >= MAX_PLAYERS;

  const grid = $("catGrid");
  grid.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const on = picked.includes(cat.name);
    const chip = el("button", "chip" + (on ? " on" : ""), catLabel(cat.name));
    chip.setAttribute("aria-pressed", String(on));
    if (played.has(cat.name)) chip.appendChild(el("span", "tag", "played"));
    chip.addEventListener("click", () => toggleCategory(cat.name));
    grid.appendChild(chip);
  });

  const left = BOARD_SIZE - picked.length;
  $("catHead").textContent = left > 0
    ? "Pick " + left + (picked.length ? " more" : "") + " categor" + (left === 1 ? "y" : "ies")
    : "Categories ready";
  $("startGame").disabled = picked.length !== BOARD_SIZE;
  $("startGame").textContent = state ? "Start (keep scores)" : "Start";
  $("backToGame").classList.toggle("hidden", !state);
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function openClue(cat, idx, value) {
  state.open = { cat, idx, value };
  state.phase = "clue";
  render();
}

function pickPlayer(i) {
  if (!state.open) return;
  state.answering = i;
  state.phase = "judge";
  render();
}

function reveal() {
  if (!state.open) return;
  state.phase = "answer";
  render();
}

function judge(correct) {
  // Guards against a double tap landing after the clue already closed.
  if (!state.open || state.answering === null) return;
  const { value } = state.open;
  state.scores[state.answering] += correct ? value : -value;
  closeClue();
}

function closeClue() {
  if (!state.open) return;
  const { cat, idx } = state.open;
  state.used[cat + "-" + idx] = true;
  returnFocus = idx * BOARD_SIZE + cat;
  state.open = null;
  state.answering = null;
  state.phase = "board";
  render();
}

function toggleCategory(name) {
  if (picked.includes(name)) picked = picked.filter(n => n !== name);
  else if (picked.length < BOARD_SIZE) picked = picked.concat(name);
  render();
}

function addPlayer() {
  if (players.length >= MAX_PLAYERS) return;
  players.push("");
  if (state) state.scores.push(0);
  render();
}

function removePlayer(i) {
  if (players.length <= MIN_PLAYERS) return;
  players.splice(i, 1);
  if (state) state.scores.splice(i, 1);
  render();
}

function showSetup() {
  picked = [];
  view = "setup";
  render();
}

function resetScores() {
  state.scores = new Array(players.length).fill(0);
  render();
}

/* =====================================================================
   CONTROLS
   ===================================================================== */
$("toSetup").addEventListener("click", showSetup);
$("resetScores").addEventListener("click", () => {
  if (confirm("Reset all scores to zero?")) resetScores();
});
$("addPlayer").addEventListener("click", addPlayer);
$("randomCats").addEventListener("click", () => { picked = randomPick(); render(); });
$("clearCats").addEventListener("click", () => { picked = []; render(); });
$("startGame").addEventListener("click", () => {
  if (picked.length === BOARD_SIZE) startGame(picked);
});
$("backToGame").addEventListener("click", () => {
  if (!state) return;
  view = "game";
  render();
});
if (narrow.addEventListener) narrow.addEventListener("change", render);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && view === "game" && state.open && state.phase === "answer") closeClue();
});

state = restoreGame(saved.game);
view = state ? "game" : "setup";
render();
</script>
</body>
</html>
